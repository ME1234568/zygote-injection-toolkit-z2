name: Packaging

on: [push, pull_request, workflow_dispatch]

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Inspect artifacts and install outside the checkout
        shell: bash
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel, = Path('dist').glob('*.whl')
          sdist, = Path('dist').glob('*.tar.gz')
          required = {'zygote_injection_toolkit/__main__.py',
                      'zygote_injection_toolkit/IOemLockService.aidl'}
          with zipfile.ZipFile(wheel) as archive:
              assert required <= set(archive.namelist())
              assert any(name.endswith('/licenses/LICENSE') for name in archive.namelist())
          with tarfile.open(sdist) as archive:
              names = {name.split('/', 1)[-1] for name in archive.getnames()}
              assert required | {'LICENSE', 'README.md', 'pyproject.toml'} <= names
          PY
          for artifact in "$GITHUB_WORKSPACE"/dist/*; do
            env_dir=$(mktemp -d)
            python -m venv "$env_dir/venv"
            "$env_dir/venv/bin/python" -m pip install "$artifact"
            (
              cd "$env_dir"
              "$env_dir/venv/bin/python" -c "import zygote_injection_toolkit.parcel; import zygote_injection_toolkit.stage1; import zygote_injection_toolkit.stage2"
              "$env_dir/venv/bin/python" -m zygote_injection_toolkit --help
            )
          done
